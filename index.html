<!DOCTYPE html>
<html lang="en">
<!--
  ==============================================================================
  index.html — Visualizador 3D WorldSkills (Modo Seguro de Competição)
  ==============================================================================
  PARA QUE SERVE ESTE ARQUIVO? (Explicação em termos leigos para o Bruno):
  Esta é a tela do visualizador 3D que os competidores e experts abrem pelo celular.
  A interface visual fica 100% em inglês (para a competição na China).
  REGRAS DE SEGURANÇA MÁXIMA:
  1. NÃO existe menu dropdown (o competidor não consegue trocar nem ver outros módulos).
  2. NÃO existe botão de gerador de link nesta tela (eles não sabem que o gerador existe).
  3. O visualizador carrega EXCLUSIVAMENTE o arquivo JSON do módulo liberado pelo líder.
  4. O toque na tela do celular é 100% livre: 1 dedo gira em 360°, 2 dedos dão zoom e arrastam.
  ==============================================================================
-->
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <meta name="theme-color" content="#090d16">
  <title>WorldSkills 3D · 4D Construction Sequence</title>
  <link rel="stylesheet" href="css/visualizador.css?v=20260921_mod_links">

  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
    }
  }
  </script>
</head>
<body>

  <!-- Loading Screen -->
  <div id="tela-carregamento" class="tela-carregamento">
    <div class="spinner-3d"></div>
    <div id="carregamento-status" class="carregamento-status">Loading 3D Model...</div>
    <div class="barra-progresso-container">
      <div id="barra-progresso" class="barra-progresso-preenchimento"></div>
    </div>
  </div>

  <!-- Mobile Touch Gesture Tip -->
  <div class="dica-toque">
    👆 1 finger: rotate &nbsp;|&nbsp; ✌️ 2 fingers: zoom & pan
  </div>

  <!-- Top Header Bar -->
  <header class="topo-bar">
    <div class="marca-projeto">
      <div class="logo-icone">4D</div>
      <div class="titulo-info">
        <span id="nome-projeto" class="titulo-principal">WorldSkills 3D</span>
        <span id="badge-modulo" class="subtitulo-modulo">
          <span class="ponto-cor" id="cor-modulo-ponto"></span>
          <span id="texto-modulo">Loading...</span>
        </span>
      </div>
    </div>
  </header>

  <!-- Fullscreen 3D Canvas -->
  <main id="canvas-container"></main>

  <!-- Floating Player Bar -->
  <section class="player-container">
    <!-- Timeline & Time Display -->
    <div class="linha-tempo-box">
      <span id="tempo-atual" class="tempo-label">00:00</span>
      <input type="range" id="slider-tempo" class="slider-tempo" min="0" max="100" value="0" step="0.1" aria-label="Timeline scrubber">
      <span id="tempo-total" class="tempo-label">00:00</span>
    </div>

    <!-- Player Controls -->
    <div class="controles-box">
      <div class="grupo-esquerda">
        <!-- Play / Pause Button -->
        <button id="btn-play" class="btn-play" aria-label="Play / Pause assembly sequence" title="Play / Pause">
          <svg id="icone-play" viewBox="0 0 24 24">
            <polygon points="6 3 20 12 6 21 6 3"></polygon>
          </svg>
          <svg id="icone-pausa" viewBox="0 0 24 24" style="display:none;">
            <rect x="6" y="4" width="4" height="16"></rect>
            <rect x="14" y="4" width="4" height="16"></rect>
          </svg>
        </button>

        <!-- Static Module Label (Non-clickable text only) -->
        <span id="etiqueta-modulo" class="badge-modulo-fixo">Module A</span>
      </div>

      <div class="grupo-direita">
        <!-- Piece Counter -->
        <span id="contador-pecas" class="contador-pecas">0 pieces</span>

        <!-- Playback Speed (1x, 1.5x, 2x, 0.5x) -->
        <button id="btn-velocidade" class="btn-velocidade" title="Playback Speed">1x</button>

        <!-- Recenter Isometric View -->
        <button id="btn-enquadrar" class="btn-auxiliar" title="Recenter Isometric View">
          <svg viewBox="0 0 24 24">
            <path d="M15 3h6v6M9 21H3v-6M21 9v6M3 9v6"></path>
            <circle cx="12" cy="12" r="3"></circle>
          </svg>
        </button>

        <!-- Botão de Ligar / Mutar Trilha Sonora -->
        <button id="btn-audio" class="btn-auxiliar" title="Mute / Unmute Background Music" aria-label="Mute or unmute music">
          <svg id="icone-som-on" viewBox="0 0 24 24">
            <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
            <path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"></path>
          </svg>
          <svg id="icone-som-off" viewBox="0 0 24 24" style="display:none;">
            <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
            <line x1="23" y1="9" x2="17" y2="15"></line>
            <line x1="17" y1="9" x2="23" y2="15"></line>
          </svg>
        </button>
      </div>
    </div>
  </section>

  <!-- Elemento de Áudio da Música de Fundo Cinematográfica -->
  <audio id="musica-fundo" src="audio/trilha.mp3" loop preload="auto"></audio>

  <!-- Main Initialization Script -->
  <script type="module">
    import { iniciarCena, carregarProjeto, alternarPlay, atualizarInstanteAnimacao, definirVelocidade } from "./js/visualizador.js?v=20260921_mod_links";
    import { iniciarFirebase } from "./js/firebase-config.js?v=20260921_mod_links";

    iniciarFirebase();

    const container3D = document.getElementById("canvas-container");
    const telaCarregamento = document.getElementById("tela-carregamento");
    const carregamentoStatus = document.getElementById("carregamento-status");
    const barraProgresso = document.getElementById("barra-progresso");
    const btnPlay = document.getElementById("btn-play");
    const iconePlay = document.getElementById("icone-play");
    const iconePausa = document.getElementById("icone-pausa");
    const sliderTempo = document.getElementById("slider-tempo");
    const spanTempoAtual = document.getElementById("tempo-atual");
    const spanTempoTotal = document.getElementById("tempo-total");
    const btnVelocidade = document.getElementById("btn-velocidade");
    const btnEnquadrar = document.getElementById("btn-enquadrar");
    const etiquetaModulo = document.getElementById("etiqueta-modulo");
    const textoModulo = document.getElementById("texto-modulo");
    const corModuloPonto = document.getElementById("cor-modulo-ponto");
    const contadorPecas = document.getElementById("contador-pecas");
    const nomeProjetoEl = document.getElementById("nome-projeto");

    // Elementos da Música de Fundo Cinematográfica
    // Explicação simples: Pegamos o arquivo de som e os ícones do botão de volume
    const musicaFundo = document.getElementById("musica-fundo");
    const btnAudio = document.getElementById("btn-audio");
    const iconeSomOn = document.getElementById("icone-som-on");
    const iconeSomOff = document.getElementById("icone-som-off");
    let audioMutado = false;

    // Ajusta o volume inicial para uma trilha agradável (40% da potência)
    if (musicaFundo) {
      musicaFundo.volume = 0.4;
    }

    // 1. Leitura do Código do Módulo no Link
    // Explicação simples: O link agora usa códigos como "?m=mod-8k2p" em vez de "A" ou "B"
    // Assim ninguém consegue adivinhar o próximo módulo trocando apenas uma letra!
    const urlParams = new URLSearchParams(window.location.search);
    const codigoModulo = (urlParams.get("m") || urlParams.get("modulo") || urlParams.get("k") || "mod-8k2p").trim();

    nomeProjetoEl.innerText = "WORLDSKILLS 3D";

    // 2. Inicializa o motor 3D
    iniciarCena(container3D);

    function formatarSegundos(s) {
      const min = Math.floor(s / 60);
      const seg = Math.floor(s % 60);
      return `${min.toString().padStart(2, "0")}:${seg.toString().padStart(2, "0")}`;
    }

    // 3. Caminho do modelo e da sequência correspondente ao código do link
    const caminhoIfc = "modelos/Projeto_Atual.ifc";
    const caminhoJson = `modelos/modulo_${codigoModulo}.json`;

    async function carregar() {
      try {
        const dados = await carregarProjeto(
          caminhoIfc,
          caminhoJson,
          null, // O arquivo do módulo já vem com a sequência correta
          (msg, progresso) => {
            carregamentoStatus.innerText = msg;
            barraProgresso.style.width = `${Math.round(progresso * 100)}%`;
          }
        );

        const modInfo = (dados.dadosJson && dados.dadosJson.moduloAtivo) ? dados.dadosJson.moduloAtivo : "";
        const tituloMod = (dados.dadosJson && dados.dadosJson.titulo) 
          ? dados.dadosJson.titulo 
          : (modInfo === "FULL" ? "Complete Project" : `Module ${modInfo}`);

        textoModulo.innerText = tituloMod;
        etiquetaModulo.innerText = modInfo === "FULL" ? "Full Project" : `Module ${modInfo}`;

        if (dados.cronograma && dados.cronograma.moduloAtivo) {
          corModuloPonto.style.backgroundColor = dados.cronograma.moduloAtivo.cor || "#38bdf8";
        } else {
          corModuloPonto.style.backgroundColor = "#38bdf8";
        }

        sliderTempo.max = dados.cronograma.duracaoTotal;
        spanTempoTotal.innerText = formatarSegundos(dados.cronograma.duracaoTotal);
        contadorPecas.innerText = `${dados.cronograma.pecas.length} pieces`;

        setTimeout(() => {
          telaCarregamento.classList.add("oculto");
        }, 300);

      } catch (erro) {
        console.error("Load error:", erro);
        carregamentoStatus.innerText = "Module not found. Please check your link or scan the QR code.";
        barraProgresso.parentElement.style.display = "none";
        const spinner = document.querySelector(".spinner-3d");
        if (spinner) spinner.style.display = "none";
      }
    }

    carregar();

    btnPlay.addEventListener("click", () => {
      const tocando = alternarPlay();
      iconePlay.style.display = tocando ? "none" : "block";
      iconePausa.style.display = tocando ? "block" : "none";

      // Toca ou pausa a música cinematográfica de fundo em harmonia com o 3D
      if (musicaFundo) {
        if (tocando && !audioMutado) {
          musicaFundo.play().catch((e) => console.log("Áudio aguardando interação:", e));
        } else {
          musicaFundo.pause();
        }
      }
    });

    // Botão de Mutar / Desmutar a música a qualquer momento
    // Explicação simples: Se a pessoa quiser apresentar em silêncio ou ligar a trilha,
    // basta dar 1 clique neste botão!
    btnAudio.addEventListener("click", () => {
      audioMutado = !audioMutado;
      musicaFundo.muted = audioMutado;

      iconeSomOn.style.display = audioMutado ? "none" : "block";
      iconeSomOff.style.display = audioMutado ? "block" : "none";
      btnAudio.classList.toggle("mutado", audioMutado);

      // Se desmutar enquanto o modelo 3D estiver em execução, inicia a música na hora
      const estaTocando = iconePausa.style.display === "block";
      if (!audioMutado && estaTocando) {
        musicaFundo.play().catch((e) => console.log("Áudio:", e));
      }
    });

    window.addEventListener("tempo-mudou", (e) => {
      const { tempo } = e.detail;
      sliderTempo.value = tempo;
      spanTempoAtual.innerText = formatarSegundos(tempo);
    });

    window.addEventListener("fim-sequencia", () => {
      iconePlay.style.display = "block";
      iconePausa.style.display = "none";

      // Pausa a música quando a montagem de todas as peças termina
      if (musicaFundo) {
        musicaFundo.pause();
      }
    });

    sliderTempo.addEventListener("input", (e) => {
      const novoTempo = parseFloat(e.target.value);
      spanTempoAtual.innerText = formatarSegundos(novoTempo);
      atualizarInstanteAnimacao(novoTempo);
    });

    btnEnquadrar.addEventListener("click", () => {
      window.dispatchEvent(new CustomEvent("solicitar-enquadrar"));
    });

    const velocidades = [1.0, 1.5, 2.0, 0.5];
    let idxVel = 0;
    btnVelocidade.addEventListener("click", () => {
      idxVel = (idxVel + 1) % velocidades.length;
      const v = velocidades[idxVel];
      btnVelocidade.innerText = `${v}x`;
      definirVelocidade(v);
    });
  </script>
</body>
</html>
